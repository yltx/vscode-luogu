# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: VSCode Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, must match package.json (for example v4.15.0)
        required: true
        type: string
      prerelease:
        description: Publish to the VS Code Marketplace pre-release channel
        required: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Validate release channel
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            IS_PRERELEASE="$RELEASE_PRERELEASE"
          else
            IS_PRERELEASE="$INPUT_PRERELEASE"
          fi
          node scripts/release-policy.mjs \
            --tag "$RELEASE_TAG" \
            --prerelease "$IS_PRERELEASE" \
            --github-output "$GITHUB_OUTPUT"
      - name: Validate
        run: npm run ci
        shell: pwsh
      - name: Package
        run: npm run pack
      - name: Upload to Github Releases
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: vscode-luogu.vsix
      - name: Publish to VSCode Marketplace
        run: >-
          npx vsce publish
          -i vscode-luogu.vsix
          ${{ steps.release.outputs.vsce-flag }}
        env:
          VSCE_PAT: ${{ secrets.PAT }}
